<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Space Talk Topics</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #off-air {
            font-size: 2rem;
            font-weight: bold;
            color: #94a3b8;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .node circle {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 2px;
            transition: opacity 0.8s ease, filter 0.5s ease;
        }

        .node.talking circle {
            stroke: #fbbf24;
            stroke-width: 6px;
            filter: drop-shadow(0px 0px 24px #fbbf24);
        }

        .node text {
            font-size: 18px;
            /* 文字サイズ大きめ */
            font-weight: 700;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            user-select: none;
        }

        .node.talking text {
            font-size: 20px;
            /* トーク中は文字も少し大きく */
        }
    </style>
</head>

<body>

    <div id="off-air">番組準備中... (ON-AIR Off)</div>
    <svg id="canvas"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        const colors = ["#f43f5e", "#8b5cf6", "#06b6d4", "#10b981", "#f59e0b", "#ec4899"];

        let nodes = [];
        let simulation;

        const svg = d3.select("#canvas")
            .attr("width", width)
            .attr("height", height);

        // D3 物理シミュレーション初期化
        simulation = d3.forceSimulation(nodes)
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("charge", d3.forceManyBody().strength(-40))
            .force("collide", d3.forceCollide().radius(d => d.r + 8).iterations(3))
            .on("tick", ticked);

        function ticked() {
            svg.selectAll(".node")
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }

        // 指定文字数で折り返し（省略せず全文を行に分割）
        function wrapTextToLines(text, maxCharsPerLine) {
            const str = String(text ?? "").trim();
            if (!str || maxCharsPerLine < 1) return [];
            const lines = [];
            for (let i = 0; i < str.length; i += maxCharsPerLine) {
                lines.push(str.slice(i, i + maxCharsPerLine));
            }
            return lines;
        }

        // 丸の半径から 1 行あたりのおおよその文字数を見積もる
        function estimateCharsPerLine(radius, fontSize) {
            const usableWidth = radius * 1.55;
            const charWidth = fontSize * 0.92;
            return Math.max(4, Math.floor(usableWidth / charWidth));
        }

        // 丸の中に収まるようフォントサイズと行数を調整しつつ全文を折り返す
        function layoutTextInCircle(text, radius, isTalking) {
            let fontSize = isTalking ? 20 : 18;
            const lineHeightEm = 1.22;
            const minFontSize = 11;

            while (fontSize >= minFontSize) {
                const maxChars = estimateCharsPerLine(radius, fontSize);
                const lines = wrapTextToLines(text, maxChars);
                const maxLines = Math.max(1, Math.floor((radius * 1.7) / (fontSize * lineHeightEm)));
                if (lines.length <= maxLines) {
                    return { lines, fontSize, lineHeightEm };
                }
                fontSize -= 1;
            }

            const maxChars = estimateCharsPerLine(radius, minFontSize);
            return {
                lines: wrapTextToLines(text, maxChars),
                fontSize: minFontSize,
                lineHeightEm
            };
        }

        // SVGテキスト要素に折り返した tspan を描画する
        function renderWrappedText(textSelection) {
            textSelection.each(function (d) {
                const el = d3.select(this);
                el.text(null);
                el.selectAll("tspan").remove();
                el.attr("y", 0);
                el.style("font-size", null);

                const { lines, fontSize, lineHeightEm } = layoutTextInCircle(d.text, d.r, d.isTalking);
                if (lines.length === 0) return;

                el.style("font-size", `${fontSize}px`);
                const startDyEm = -((lines.length - 1) / 2) * lineHeightEm;

                lines.forEach((line, i) => {
                    el.append("tspan")
                        .attr("x", 0)
                        .attr("dy", i === 0 ? `${startDyEm}em` : `${lineHeightEm}em`)
                        .text(line);
                });
            });
        }

        // データの更新・描画処理
        function updateVisualization(topics) {
            // お題の数に応じて丸の半径(r)を変化（最小70px〜最大110px）
            const count = topics.length || 1;
            const radius = Math.max(70, Math.min(110, 360 / Math.sqrt(count)));

            // 既存ノードとの突合・更新
            const newNodes = topics.map(t => {
                const existing = nodes.find(n => n.id === t.id);
                return {
                    id: t.id,
                    text: t.text,
                    isTalking: t.isTalking,
                    r: radius,
                    color: existing ? existing.color : colors[Math.floor(Math.random() * colors.length)],
                    x: existing ? existing.x : width / 2 + (Math.random() - 0.5) * 100,
                    y: existing ? existing.y : height / 2 + (Math.random() - 0.5) * 100
                };
            });

            nodes = newNodes;

            // 物理シミュレーションの更新
            simulation.nodes(nodes);

            // トーク中(isTalking)の丸は中央へ強力に惹きつける
            simulation.force("x", d3.forceX(width / 2).strength(d => d.isTalking ? 0.35 : 0.01));
            simulation.force("y", d3.forceY(height / 2).strength(d => d.isTalking ? 0.35 : 0.01));
            simulation.force("collide", d3.forceCollide().radius(d => d.r + 10));
            simulation.alpha(0.3).restart();

            // D3 データバインド
            const nodeSelection = svg.selectAll(".node")
                .data(nodes, d => d.id);

            // 削除（消化済などで消えたお題）
            nodeSelection.exit()
                .transition().duration(800)
                .style("opacity", 0)
                .remove();

            // 新規追加
            const enter = nodeSelection.enter().append("g")
                .attr("class", d => `node ${d.isTalking ? 'talking' : ''}`)
                .style("opacity", 0);

            enter.append("circle")
                .attr("r", d => d.r)
                .attr("fill", d => d.color);

            enter.append("text"); // 空のtext要素を追加

            enter.transition().duration(500).style("opacity", 1);

            // 更新（新規＋既存要素の両方に適用）
            const merged = enter.merge(nodeSelection);
            merged.attr("class", d => `node ${d.isTalking ? 'talking' : ''}`);
            merged.select("circle")
                .transition().duration(300)
                .attr("r", d => d.r);

            // テキスト描画の適用
            merged.select("text").call(renderWrappedText);
        }

        // 3秒おきにCloudflare FunctionsのAPIをポーリング
        async function fetchData() {
            try {
                const res = await fetch("/api/sheets");
                const data = await res.json();

                if (!data.isOnAir) {
                    document.getElementById("off-air").style.display = "block";
                    document.getElementById("canvas").style.display = "none";
                } else {
                    document.getElementById("off-air").style.display = "none";
                    document.getElementById("canvas").style.display = "block";
                    updateVisualization(data.topics);
                }
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>

</html>
