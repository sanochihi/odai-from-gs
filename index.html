<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Space Talk Topics</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #off-air {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            width: min(720px, 92vw);
            padding: 2rem;
            text-align: center;
            z-index: 20;
        }

        #off-air h1 {
            margin: 0;
            font-size: clamp(2rem, 5.2vw, 3.15rem);
            font-weight: 800;
            line-height: 1.35;
            color: #ffffff;
        }

        .off-air-notice h2 {
            margin: 0 0 1rem;
            font-size: 1.45rem;
            font-weight: 700;
            color: #94a3b8;
        }

        #off-air-notice-body {
            margin: 0;
            font-size: clamp(1.2rem, 2.9vw, 1.55rem);
            font-weight: 500;
            line-height: 1.75;
            color: #e2e8f0;
            white-space: pre-line;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .node circle {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 2px;
            transition: opacity 0.8s ease, filter 0.5s ease;
        }

        .node.talking circle {
            stroke: #fbbf24;
            stroke-width: 6px;
            filter: drop-shadow(0px 0px 24px #fbbf24);
        }

        .node text {
            font-size: 22px;
            font-weight: 700;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            user-select: none;
        }

        .node.talking text {
            font-size: 24px;
        }

        .node.inactive circle {
            opacity: 0.42;
            stroke: rgba(255, 255, 255, 0.22);
            stroke-width: 1.5px;
        }

        .node.inactive text {
            fill: rgba(255, 255, 255, 0.82);
            font-weight: 600;
        }

        .speaker-name {
            text-anchor: middle;
            font-size: 20px;
            font-weight: 700;
            fill: #ffffff;
        }

        .speaker-avatar circle {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 2px;
            fill: #334155;
            transition: stroke 0.3s ease, stroke-width 0.3s ease, filter 0.5s ease;
        }

        .speaker.spotlight .speaker-avatar circle {
            stroke: #fbbf24;
            stroke-width: 6px;
            filter: drop-shadow(0px 0px 24px #fbbf24);
        }

        .speaker-fallback {
            text-anchor: middle;
            dominant-baseline: central;
            font-size: 34px;
            font-weight: 700;
            fill: #ffffff;
            pointer-events: none;
        }

        .speaker-image {
            pointer-events: none;
        }

        .program-title text {
            text-anchor: middle;
            dominant-baseline: central;
            font-weight: 800;
            fill: #ffffff;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>

<body>

    <div id="off-air">
        <h1 id="off-air-welcome"></h1>
        <section class="off-air-notice" aria-label="番組からのお知らせ">
            <h2>番組からのお知らせ</h2>
            <p id="off-air-notice-body"></p>
        </section>
    </div>
    <svg id="canvas"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        const colors = ["#f43f5e", "#8b5cf6", "#06b6d4", "#10b981", "#f59e0b", "#ec4899"];

        // A列の通番から色を決める（端末・再描画に依存しない）
        function colorForTopicId(id) {
            const n = parseInt(String(id), 10);
            const idx = Number.isNaN(n) ? 0 : n;
            return colors[((idx % colors.length) + colors.length) % colors.length];
        }

        let topicNodes = [];
        let speakerNodes = [];
        let programTitleNode = null;
        let topicLayoutBands = null;
        let speakers = [];
        let simulation;

        const svg = d3.select("#canvas")
            .attr("width", width)
            .attr("height", height);

        const topicsLayer = svg.append("g").attr("id", "topics-layer");
        const titleLayer = svg.append("g").attr("id", "title-layer");
        const speakersLayer = svg.append("g").attr("id", "speakers-layer");

        // ラベル・名前込みのスピーカー全体が他要素と重ならないよう、衝突半径を大きめに取る
        function speakerCollideRadius(circleRadius) {
            const halfW = circleRadius + 20;
            const halfH = circleRadius + 52;
            return Math.hypot(halfW, halfH);
        }

        // タイトル文字列が収まる長方形（中心基準の半幅・半高さ）
        function programTitleBounds(text, fontSize) {
            const halfW = Math.min(width * 0.48, (text.length * fontSize * 0.62) / 2 + 12);
            const halfH = fontSize * 0.55 + 10;
            return { halfW, halfH };
        }

        function collideRadius(d) {
            if (d.kind === "programTitle") return 0;
            if (d.kind === "speaker") return d.collideR;
            if (d.kind === "topic" && d.sizeTier === "small") return d.r + 6;
            return d.r + (d.isTalking ? 10 : 8);
        }

        function topicSizeTier(isActive, isTalking) {
            if (!isActive) return "small";
            if (isTalking) return "large";
            return "medium";
        }

        function refreshTopicLayoutBands() {
            const titleBottom = programTitleNode
                ? programTitleNode.fy + programTitleNode.halfH + 32
                : height * 0.14;

            const smallBandTop = height * 0.68;
            const mediumBandBottom = smallBandTop - 20;
            const largeBandBottom = titleBottom + Math.max(130, (mediumBandBottom - titleBottom) * 0.36);
            const mediumBandTop = largeBandBottom + 24;

            topicLayoutBands = {
                large: {
                    top: titleBottom,
                    bottom: largeBandBottom,
                    centerY: titleBottom + (largeBandBottom - titleBottom) / 2
                },
                medium: {
                    top: mediumBandTop,
                    bottom: mediumBandBottom,
                    centerY: mediumBandTop + (mediumBandBottom - mediumBandTop) / 2
                },
                small: {
                    top: smallBandTop,
                    bottom: height - VIEWPORT_PAD,
                    centerY: smallBandTop + (height - VIEWPORT_PAD - smallBandTop) / 2
                }
            };
        }

        function topicHorizontalSpan(sizeTier) {
            if (sizeTier === "small") {
                return { left: 16, right: width - 16 };
            }
            return { left: width * 0.19, right: width * 0.81 };
        }

        function topicTargetX(d) {
            const count = d.tierCount || 1;
            const idx = d.tierIndex ?? 0;
            const { left, right } = topicHorizontalSpan(d.sizeTier);
            if (count <= 1) return width / 2;
            return left + ((idx + 0.5) / count) * (right - left);
        }

        function topicTargetY(d) {
            if (!topicLayoutBands) refreshTopicLayoutBands();
            return topicLayoutBands[d.sizeTier].centerY;
        }

        function speakerAnchorPosition(slot, r, isSpotlight) {
            const { halfW } = speakerViewportHalfExtents({ r, isSpotlight, slot });
            const pad = VIEWPORT_PAD + 10;
            return {
                x: slot === 0 ? halfW + pad : width - halfW - pad,
                y: height / 2
            };
        }

        // 円（お題・スピーカー）がタイトル長方形の外側に出るよう押し出す
        function clampCircleOutsideRect(x, y, circleR, rectCx, rectCy, halfW, halfH, gap) {
            const expandW = halfW + gap + circleR;
            const expandH = halfH + gap + circleR;
            const dx = x - rectCx;
            const dy = y - rectCy;

            if (Math.abs(dx) >= expandW || Math.abs(dy) >= expandH) {
                return { x, y };
            }

            const penX = expandW - Math.abs(dx);
            const penY = expandH - Math.abs(dy);

            if (penX < penY) {
                return { x: rectCx + Math.sign(dx || 1) * expandW, y };
            }
            return { x, y: rectCy + Math.sign(dy || 1) * expandH };
        }

        function simulationNodes() {
            const nodes = [...topicNodes, ...speakerNodes];
            if (programTitleNode) nodes.push(programTitleNode);
            return nodes;
        }

        function syncSimulationForces() {
            simulation.nodes(simulationNodes());
            simulation.force("collide", d3.forceCollide().radius(collideRadius).iterations(10));
            simulation.force("charge", d3.forceManyBody().strength(d => {
                if (d.kind === "speaker") return -16;
                if (d.kind === "topic") return -24;
                return 0;
            }));
            simulation.force("x", d3.forceX(d => {
                if (d.kind === "speaker") return d.anchorX;
                if (d.kind === "topic") return topicTargetX(d);
                return d.x;
            }).strength(d => {
                if (d.kind === "speaker") return 0.038;
                if (d.kind === "topic") return 0.032;
                return 0;
            }));
            simulation.force("y", d3.forceY(d => {
                if (d.kind === "speaker") return d.anchorY;
                if (d.kind === "topic") return topicTargetY(d);
                return d.y;
            }).strength(d => {
                if (d.kind === "speaker") return 0.038;
                if (d.kind === "topic") return 0.085;
                return 0;
            }));
        }

        // D3 物理シミュレーション（ゾーン内で衝突しながらふわふわ漂う）
        simulation = d3.forceSimulation([])
            .force("collide", d3.forceCollide().radius(collideRadius).iterations(10))
            .on("tick", ticked);

        // 固定タイトルと他要素が視覚的に重ならないよう、毎フレーム押し出す
        function enforceTitleClearance() {
            if (!programTitleNode) return;

            const tx = programTitleNode.fx;
            const ty = programTitleNode.fy;
            const { halfW, halfH } = programTitleNode;
            const gap = 10;

            for (const n of [...topicNodes, ...speakerNodes]) {
                const nr = collideRadius(n);
                const pos = clampCircleOutsideRect(n.x, n.y, nr, tx, ty, halfW, halfH, gap);
                n.x = pos.x;
                n.y = pos.y;
            }
        }

        const VIEWPORT_PAD = 8;

        function topicViewportMargin(d) {
            if (d.kind !== "topic") return 0;
            if (d.isTalking) return d.r + 14;
            if (!d.isActive) return d.r + 8;
            return d.r + 10;
        }

        /** スピーカー（アイコン＋名前＋スポットライト）の中心から見た半幅・半高さ */
        function speakerViewportHalfExtents(d) {
            const glow = d.isSpotlight ? 16 : 4;
            return {
                halfW: d.r + 20 + glow,
                halfH: d.r + 52 + glow
            };
        }

        function clampTopicInViewport(n) {
            const m = topicViewportMargin(n);
            n.x = Math.max(m, Math.min(width - m, n.x));
            n.y = Math.max(m, Math.min(height - m, n.y));
        }

        function clampSpeakerInViewport(n) {
            if (n.r == null) return;
            if (n.collideR == null) n.collideR = speakerCollideRadius(n.r);
            const { halfW, halfH } = speakerViewportHalfExtents(n);
            const pad = VIEWPORT_PAD;
            n.x = Math.max(halfW + pad, Math.min(width - halfW - pad, n.x));
            n.y = Math.max(halfH + pad, Math.min(height - halfH - pad, n.y));
        }

        function enforceViewportBounds() {
            for (const n of topicNodes) clampTopicInViewport(n);
            for (const n of speakerNodes) clampSpeakerInViewport(n);
        }

        function clampTopicToVerticalBand(n) {
            if (!topicLayoutBands || n.kind !== "topic") return;
            const band = topicLayoutBands[n.sizeTier];
            const m = topicViewportMargin(n);
            const yMin = band.top + m;
            const yMax = band.bottom - m;
            if (yMin <= yMax) {
                n.y = Math.max(yMin, Math.min(yMax, n.y));
            }
        }

        function applyAnchorDrift() {
            for (const n of speakerNodes) {
                if (n.anchorX == null) continue;
                n.x += (n.anchorX - n.x) * 0.028;
                n.y += (n.anchorY - n.y) * 0.028;
            }
            for (const n of topicNodes) {
                n.x += (topicTargetX(n) - n.x) * 0.022;
                n.y += (topicTargetY(n) - n.y) * 0.035;
            }
        }

        function ticked() {
            enforceTitleClearance();
            applyAnchorDrift();
            for (const n of topicNodes) clampTopicToVerticalBand(n);
            enforceViewportBounds();

            topicsLayer.selectAll(".node")
                .attr("transform", d => `translate(${d.x},${d.y})`);
            titleLayer.selectAll(".program-title")
                .attr("transform", d => `translate(${d.x},${d.y})`);
            speakersLayer.selectAll(".speaker")
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }

        function buildProgramTitleNode(title) {
            const text = String(title ?? "").trim();
            if (!text) return null;

            const fontSize = Math.min(52, Math.max(34, width * 0.048));
            const { halfW, halfH } = programTitleBounds(text, fontSize);
            // 画面上部中央に固定（fx/fy）。長方形の上端が画面上端付近になるよう配置
            const topMargin = 14;
            const topY = topMargin + halfH;

            return {
                kind: "programTitle",
                id: "program-title",
                text,
                fontSize,
                halfW,
                halfH,
                x: width / 2,
                y: topY,
                fx: width / 2,
                fy: topY
            };
        }

        function updateProgramTitleDom() {
            const data = programTitleNode ? [programTitleNode] : [];
            const sel = titleLayer.selectAll(".program-title").data(data, d => d.id);

            sel.exit().remove();

            const enter = sel.enter().append("g").attr("class", "program-title");
            enter.append("text");

            enter.merge(sel).select("text")
                .attr("y", 0)
                .style("font-size", d => `${d.fontSize}px`)
                .text(d => d.text);
        }

        function buildSpeakerNodes(speakerList, radius, spotlightBySlot) {
            return (speakerList || []).slice(0, 2).map((s, i) => {
                const existing = speakerNodes.find(n => n.id === s.label);
                const isSpotlight = Boolean(spotlightBySlot && spotlightBySlot[i]);
                const anchor = speakerAnchorPosition(i, radius, isSpotlight);
                return {
                    kind: "speaker",
                    id: s.label,
                    label: s.label,
                    name: s.name,
                    iconUrl: s.iconUrl,
                    slot: i,
                    isSpotlight,
                    r: radius,
                    collideR: speakerCollideRadius(radius),
                    anchorX: anchor.x,
                    anchorY: anchor.y,
                    x: existing ? existing.x : anchor.x + (Math.random() - 0.5) * 28,
                    y: existing ? existing.y : anchor.y + (Math.random() - 0.5) * 24
                };
            });
        }

        function updateSpeakersDom(radius) {
            let defs = svg.select("defs");
            if (defs.empty()) defs = svg.append("defs");
            defs.selectAll("[id^='clip-speaker-']").remove();

            speakerNodes.forEach((s) => {
                defs.append("clipPath")
                    .attr("id", `clip-speaker-${s.label}`)
                    .append("circle")
                    .attr("r", radius);
            });

            const sel = speakersLayer.selectAll(".speaker")
                .data(speakerNodes, d => d.id);

            sel.exit().remove();

            const enter = sel.enter().append("g").attr("class", "speaker");
            const avatarEnter = enter.append("g").attr("class", "speaker-avatar");
            avatarEnter.append("circle");
            avatarEnter.append("text").attr("class", "speaker-fallback").text("^_^");
            enter.append("text").attr("class", "speaker-name");

            const merged = enter.merge(sel);
            merged.attr("class", d => `speaker${d.isSpotlight ? " spotlight" : ""}`);
            merged.selectAll(".speaker-label").remove();
            merged.select(".speaker-name")
                .attr("y", radius + 28)
                .text(d => d.name);

            merged.select(".speaker-avatar").each(function (d) {
                const avatar = d3.select(this);
                avatar.select("circle").attr("r", radius);

                const fallback = avatar.select(".speaker-fallback").attr("y", 0);
                let img = avatar.select(".speaker-image");

                if (!d.iconUrl) {
                    img.remove();
                    fallback.style("display", null);
                    return;
                }

                if (img.empty()) {
                    img = avatar.append("image").attr("class", "speaker-image")
                        .on("load", function () {
                            avatar.select(".speaker-fallback").style("display", "none");
                        })
                        .on("error", function () {
                            d3.select(this).remove();
                            avatar.select(".speaker-fallback").style("display", null);
                        });
                    fallback.style("display", null);
                }

                if (img.attr("href") !== d.iconUrl) {
                    img.attr("href", d.iconUrl);
                    fallback.style("display", null);
                }

                img
                    .attr("x", -radius)
                    .attr("y", -radius)
                    .attr("width", radius * 2)
                    .attr("height", radius * 2)
                    .attr("clip-path", `url(#clip-speaker-${d.label})`);
            });
        }

        // 指定文字数で折り返し（省略せず全文を行に分割）
        function wrapTextToLines(text, maxCharsPerLine) {
            const str = String(text ?? "").trim();
            if (!str || maxCharsPerLine < 1) return [];
            const lines = [];
            for (let i = 0; i < str.length; i += maxCharsPerLine) {
                lines.push(str.slice(i, i + maxCharsPerLine));
            }
            return lines;
        }

        // 丸の半径から 1 行あたりのおおよその文字数を見積もる
        function estimateCharsPerLine(radius, fontSize) {
            const usableWidth = radius * 1.55;
            const charWidth = fontSize * 0.92;
            return Math.max(4, Math.floor(usableWidth / charWidth));
        }

        function maxLinesInCircle(radius, fontSize, lineHeightEm) {
            return Math.max(1, Math.floor((radius * 1.7) / (fontSize * lineHeightEm)));
        }

        // 丸の中に収まるようフォントサイズと行数を調整しつつ全文を折り返す
        function layoutTextInCircle(text, radius, isTalking, options = {}) {
            const lineHeightEm = options.lineHeightEm ?? 1.22;
            let fontSize = options.startFontSize ?? (isTalking ? 22 : 20);
            const minFontSize = options.minFontSize ?? 12;

            while (fontSize >= minFontSize) {
                const maxChars = estimateCharsPerLine(radius, fontSize);
                const lines = wrapTextToLines(text, maxChars);
                const maxLines = maxLinesInCircle(radius, fontSize, lineHeightEm);
                if (lines.length <= maxLines) {
                    return { lines, fontSize, lineHeightEm };
                }
                fontSize -= 1;
            }

            const maxChars = estimateCharsPerLine(radius, minFontSize);
            return {
                lines: wrapTextToLines(text, maxChars),
                fontSize: minFontSize,
                lineHeightEm
            };
        }

        function textFitsInCircle(text, radius, options = {}) {
            const lineHeightEm = options.lineHeightEm ?? 1.22;
            let fontSize = options.startFontSize ?? 20;
            const minFontSize = options.minFontSize ?? 12;

            while (fontSize >= minFontSize) {
                const maxChars = estimateCharsPerLine(radius, fontSize);
                const lines = wrapTextToLines(text, maxChars);
                const maxLines = maxLinesInCircle(radius, fontSize, lineHeightEm);
                if (lines.length <= maxLines) return true;
                fontSize -= 1;
            }

            const maxChars = estimateCharsPerLine(radius, minFontSize);
            const lines = wrapTextToLines(text, maxChars);
            const maxLines = maxLinesInCircle(radius, minFontSize, lineHeightEm);
            return lines.length <= maxLines;
        }

        /** 小＝旧中、中・大はそれに連動して一段階アップ */
        function topicTextLayoutOptions(d) {
            if (d.sizeTier === "small") {
                return { startFontSize: 18, minFontSize: 11 };
            }
            if (d.sizeTier === "large") {
                return { startFontSize: 22, minFontSize: 12 };
            }
            return { startFontSize: 20, minFontSize: 12 };
        }

        /** topics/topics.yaml（/api/topics-config）— 未読込時は 0.8 倍済みの既定値 */
        const TOPICS_SIZE_FALLBACK = {
            mediumRadiusMin: 56,
            mediumRadiusMax: 88,
            mediumRadiusBase: 288,
            largeMediumScale: 1.35,
            smallMaxRatio: 0.52,
            smallMinRatio: 0.32,
            smallDiameterScale: 2,
            smallMinRadiusFloor: 38,
            smallCapRadiusFloor: 45,
            viewportEdgePadding: 24,
            speakerAvatarRadiusMin: 70,
            speakerAvatarRadiusMax: 110,
            speakerAvatarRadiusBase: 360
        };

        let topicsSizeConfig = null;

        function topicsSize() {
            return topicsSizeConfig || TOPICS_SIZE_FALLBACK;
        }

        function inactiveTopicRadiusViewportMax() {
            const pad = topicsSize().viewportEdgePadding;
            return Math.min((width - pad) / 2, (height - pad) / 2);
        }

        /** 中：C=1 かつスポットライトなし */
        function mediumTopicRadius(activeCount) {
            const c = topicsSize();
            const count = activeCount || 1;
            return Math.max(
                c.mediumRadiusMin,
                Math.min(c.mediumRadiusMax, c.mediumRadiusBase / Math.sqrt(count))
            );
        }

        /** 大：スポットライト（トーク中） */
        function largeTopicRadius(mediumR) {
            const c = topicsSize();
            return Math.min(
                inactiveTopicRadiusViewportMax(),
                Math.round(mediumR * c.largeMediumScale)
            );
        }

        /** 小：C≠1（中より小さく、全文が収まる半径） */
        function computeSmallTopicRadius(text, mediumR) {
            const c = topicsSize();
            const scale = c.smallDiameterScale;
            const cap = Math.min(
                inactiveTopicRadiusViewportMax(),
                Math.max(
                    c.smallCapRadiusFloor,
                    Math.floor(mediumR * c.smallMaxRatio * scale)
                )
            );
            const minR = Math.max(
                c.smallMinRadiusFloor,
                Math.floor(mediumR * c.smallMinRatio * scale)
            );
            const textLayout = topicTextLayoutOptions({ sizeTier: "small" });
            for (let r = minR; r <= cap; r++) {
                if (textFitsInCircle(text, r, textLayout)) return r;
            }
            return cap;
        }

        function speakerAvatarRadius(activeCount) {
            const c = topicsSize();
            const count = activeCount || 1;
            return Math.max(
                c.speakerAvatarRadiusMin,
                Math.min(c.speakerAvatarRadiusMax, c.speakerAvatarRadiusBase / Math.sqrt(count))
            );
        }

        function topicNodeClass(d) {
            const parts = ["node"];
            if (d.isTalking) parts.push("talking");
            if (!d.isActive) parts.push("inactive");
            return parts.join(" ");
        }

        // SVGテキスト要素に折り返した tspan を描画する
        function renderWrappedText(textSelection) {
            textSelection.each(function (d) {
                const el = d3.select(this);
                el.text(null);
                el.selectAll("tspan").remove();
                el.attr("y", 0);
                el.style("font-size", null);

                const layoutOpts = topicTextLayoutOptions(d);
                const { lines, fontSize, lineHeightEm } = layoutTextInCircle(d.text, d.r, d.isTalking, layoutOpts);
                if (lines.length === 0) return;

                el.style("font-size", `${fontSize}px`);
                const startDyEm = -((lines.length - 1) / 2) * lineHeightEm;

                lines.forEach((line, i) => {
                    el.append("tspan")
                        .attr("x", 0)
                        .attr("dy", i === 0 ? `${startDyEm}em` : `${lineHeightEm}em`)
                        .text(line);
                });
            });
        }

        // データの更新・描画処理
        function updateVisualization(topics, programTitle, spotlightBySlot) {
            const activeTopics = topics.filter(t => t.isActive !== false);

            const mediumRadius = mediumTopicRadius(activeTopics.length);
            const speakerRadius = speakerAvatarRadius(activeTopics.length);

            programTitleNode = buildProgramTitleNode(programTitle);
            refreshTopicLayoutBands();

            const topicMeta = topics.map(t => {
                const isActive = t.isActive !== false;
                const isTalking = Boolean(isActive && t.isTalking);
                const sizeTier = topicSizeTier(isActive, isTalking);
                return { t, isActive, isTalking, sizeTier };
            });
            const tierCounts = { large: 0, medium: 0, small: 0 };
            topicMeta.forEach(m => { tierCounts[m.sizeTier] += 1; });
            const tierCounters = { large: 0, medium: 0, small: 0 };

            topicNodes = topicMeta.map(({ t, isActive, isTalking, sizeTier }) => {
                const existing = topicNodes.find(n => n.id === t.id);
                let r;
                if (sizeTier === "small") {
                    r = computeSmallTopicRadius(t.text, mediumRadius);
                } else if (sizeTier === "large") {
                    r = largeTopicRadius(mediumRadius);
                } else {
                    r = mediumRadius;
                }

                const tierIndex = tierCounters[sizeTier];
                tierCounters[sizeTier] += 1;
                const tierCount = tierCounts[sizeTier];

                const layoutStub = { sizeTier, tierIndex, tierCount, r };
                const tx = topicTargetX(layoutStub);
                const ty = topicTargetY(layoutStub);

                return {
                    kind: "topic",
                    id: t.id,
                    text: t.text,
                    isActive,
                    isTalking,
                    sizeTier,
                    tierIndex,
                    tierCount,
                    r,
                    color: colorForTopicId(t.id),
                    x: existing ? existing.x : tx + (Math.random() - 0.5) * 36,
                    y: existing ? existing.y : ty + (Math.random() - 0.5) * 28
                };
            });
            topicNodes.forEach(n => {
                clampTopicToVerticalBand(n);
                clampTopicInViewport(n);
            });

            speakerNodes = buildSpeakerNodes(speakers, speakerRadius, spotlightBySlot);
            speakerNodes.forEach(clampSpeakerInViewport);
            syncSimulationForces();
            simulation.alpha(0.3).restart();

            updateProgramTitleDom();
            updateSpeakersDom(speakerRadius);

            const nodeSelection = topicsLayer.selectAll(".node")
                .data(topicNodes, d => d.id);

            // 削除（消化済などで消えたお題）
            nodeSelection.exit()
                .transition().duration(800)
                .style("opacity", 0)
                .remove();

            // 新規追加
            const enter = nodeSelection.enter().append("g")
                .attr("class", topicNodeClass)
                .style("opacity", 0);

            enter.append("circle")
                .attr("r", d => d.r)
                .attr("fill", d => d.color);

            enter.append("text"); // 空のtext要素を追加

            enter.transition().duration(500).style("opacity", 1);

            // 更新（新規＋既存要素の両方に適用）
            const merged = enter.merge(nodeSelection);
            merged.attr("class", topicNodeClass);
            merged.select("circle")
                .transition().duration(300)
                .attr("r", d => d.r)
                .attr("fill", d => d.color);

            // テキスト描画の適用
            merged.select("text").call(renderWrappedText);
        }

        // 3秒おきにCloudflare FunctionsのAPIをポーリング
        async function fetchSpeakers() {
            try {
                const res = await fetch("/api/speakers");
                const data = await res.json();
                speakers = data.speakers || [];
            } catch (e) {
                console.error("Speakers fetch error:", e);
                speakers = [];
            }
        }

        async function fetchTopicsSizeConfig() {
            try {
                const res = await fetch("/api/topics-config");
                if (!res.ok) return;
                topicsSizeConfig = await res.json();
            } catch (e) {
                console.error("Topics config fetch error:", e);
            }
        }

        const OFF_AIR_SPEAKER_RADIUS = 90;

        function updateOffAirScreen(data) {
            const title = (data.programTitle || "").trim() || "この番組";
            document.getElementById("off-air-welcome").textContent = `「${title}」へようこそ！`;

            const lines = Array.isArray(data.announcementLines) ? data.announcementLines : [];
            document.getElementById("off-air-notice-body").textContent = lines.join("\n");
        }

        function updateOffAirSpeakers() {
            const radius = OFF_AIR_SPEAKER_RADIUS;
            speakerNodes = (speakers || []).slice(0, 2).map((s, i) => {
                const anchor = speakerAnchorPosition(i, radius, false);
                return {
                    kind: "speaker",
                    id: s.label,
                    label: s.label,
                    name: s.name,
                    iconUrl: s.iconUrl,
                    slot: i,
                    isSpotlight: false,
                    r: radius,
                    collideR: speakerCollideRadius(radius),
                    anchorX: anchor.x,
                    anchorY: anchor.y,
                    x: anchor.x,
                    y: anchor.y
                };
            });
            speakerNodes.forEach(clampSpeakerInViewport);

            topicNodes = [];
            programTitleNode = null;
            topicsLayer.selectAll(".node").remove();
            titleLayer.selectAll(".program-title").remove();
            simulation.nodes([]);
            simulation.stop();

            updateSpeakersDom(radius);
            speakersLayer.selectAll(".speaker")
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }

        async function fetchData() {
            try {
                const [sheetsRes] = await Promise.all([
                    fetch("/api/sheets"),
                    fetchSpeakers(),
                    fetchTopicsSizeConfig()
                ]);
                const data = await sheetsRes.json();

                if (!data.isOnAir) {
                    document.getElementById("off-air").style.display = "flex";
                    document.getElementById("canvas").style.display = "block";
                    updateOffAirScreen(data);
                    updateOffAirSpeakers();
                } else {
                    document.getElementById("off-air").style.display = "none";
                    document.getElementById("canvas").style.display = "block";
                    updateVisualization(data.topics, data.programTitle, [
                        data.speaker1Spotlight,
                        data.speaker2Spotlight
                    ]);
                }
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
